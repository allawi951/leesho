    <nav class="nav__links">

      <a class="nav__link" href="#collection" data-i18n="nav.collection"></a>

      <a class="nav__link" href="#visit" data-i18n="nav.visit"></a>

</header>

    <p class="hero__word" id="heroWord" aria-hidden="true"></p>
    <p class="hero__sub" data-i18n="hero.sub" id="heroSub"></p>
    <p class="hero__line" data-i18n="hero.line" id="heroLine"></p>

  <div class="hero__cue" id="heroCue">
    <i></i><span data-i18n="hero.scroll"></span>

</section>

<!-- ═══════════ الفصل ١ — هرم الرائحة ═══════════ -->
<section class="notes" id="notes">
  <div class="notes__pin" id="notesPin">
    <div class="notes__grid">
      <div class="notes__head">
        <p class="eyebrow" data-i18n="notes.eyebrow"></p>
        <h2 class="display" style="font-size:clamp(1.9rem,3.6vw,3rem);margin-block:.7rem 0" data-i18n="notes.title"></h2>
      </div>

      <div class="notes__media">
        <div class="notes__frame">
        <div class="notes__ring"></div>
        <div class="notes__img" data-note="0"><img src="assets/img/note-top.jpg" alt=""></div>
        <div class="notes__img" data-note="1"><img src="assets/img/note-heart.jpg" alt=""></div>
        <div class="notes__img" data-note="2"><img src="assets/img/note-base.jpg" alt=""></div>
        </div>
      </div>

      <div class="notes__body">
        <div class="notes__steps">
          <article class="notes__step" data-step="0">
            <h3><span data-i18n="notes.top.t"></span> <b data-i18n="notes.top.k"></b></h3>
            <p data-i18n="notes.top.d"></p>
          </article>
          <article class="notes__step" data-step="1">
            <h3><span data-i18n="notes.heart.t"></span> <b data-i18n="notes.heart.k"></b></h3>
            <p data-i18n="notes.heart.d"></p>
          </article>
          <article class="notes__step" data-step="2">
            <h3><span data-i18n="notes.base.t"></span> <b data-i18n="notes.base.k"></b></h3>
            <p data-i18n="notes.base.d"></p>
          </article>
        </div>

        <div class="notes__bar"><i id="notesBar"></i></div>
      </div>
    </div>
  </div>
</section>

<!-- ═══════════ الفصل ٢ — المجموعة ═══════════ -->
<section class="coll" id="collection">
  <div class="coll__head">
    <p class="eyebrow" data-i18n="coll.eyebrow"></p>
    <h2 class="display" data-i18n="coll.title"></h2>
    <p class="coll__hint" data-i18n="coll.hint"></p>
  </div>
  <div class="coll__pin" id="collPin">
    <div class="coll__track" id="collTrack"></div>
  </div>
</section>

<!-- ═══════════ الفصل ٣ — الحكاية ═══════════ -->
<section class="story" id="story">
  <div class="story__row">
    <div class="story__media"><img src="assets/img/story-hands.jpg" alt="" data-parallax></div>
    <div class="story__text">
      <p class="story__num">01</p>
      <h3 data-i18n="story.t1"></h3>
      <p data-i18n="story.d1"></p>
    </div>
  </div>
  <div class="story__row">
    <div class="story__media"><img src="assets/img/story-atelier.jpg" alt="" data-parallax></div>
    <div class="story__text">
      <p class="story__num">02</p>
      <h3 data-i18n="story.t2"></h3>
      <p data-i18n="story.d2"></p>
    </div>
  </div>
  <div class="story__row">
    <div class="story__media"><img src="assets/img/story-marble.jpg" alt="" data-parallax></div>
    <div class="story__text">
      <p class="story__num">03</p>
      <h3 data-i18n="story.t3"></h3>
      <p data-i18n="story.d3"></p>
    </div>
  </div>
</section>

<!-- ═══════════ الفصل ٤ — جرّبه ═══════════ -->
<section class="visit" id="visit">
  <div class="visit__bg"><img src="assets/img/mood-silk.jpg" alt="" data-parallax></div>
  <div class="visit__in">
    <p class="eyebrow" data-i18n="visit.eyebrow"></p>
    <h2 class="display" data-i18n="visit.title"></h2>
    <p class="lede" data-i18n="visit.desc"></p>
    <p class="visit__hours" data-i18n="visit.hours"></p>
    <div class="visit__cta">
      <a href="#collection" class="btn btn--solid" data-magnetic data-i18n="visit.cta"></a>
      <button class="btn" data-magnetic data-demo data-i18n="visit.contact"></button>
    </div>
  </div>
</section>

</main>

<!-- ═══════════ الذيل ═══════════ -->
<footer class="foot">
  <div class="foot__in">
    <span class="foot__mark" data-mark></span>
    <p class="foot__meta">© <span id="year"></span> <span data-i18n="brand.full"></span> · <span data-i18n="foot.rights"></span></p>

    <p class="foot__sample-en" data-i18n="foot.sampleEn"></p>
    <p class="foot__demo">◆ <span data-i18n="foot.demo"></span></p>
  </div>
</footer>

  <button class="icon-btn mmenu__x" data-close aria-label="Close">

  </button>
  <ul class="mmenu__list">
    <li><a href="#notes"      data-close data-i18n="nav.notes"></a></li>
    <li><a href="#collection" data-close data-i18n="nav.collection"></a></li>
    <li><a href="#story"      data-close data-i18n="nav.story"></a></li>
    <li><a href="#visit"      data-close data-i18n="nav.visit"></a></li>
  </ul>
  <span class="mmenu__mark" data-mark></span>
</nav>

<!-- ═══════════ درج الحقيبة ═══════════ -->
<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer__head">
    <h2 data-i18n="cart.title"></h2>
    <button class="icon-btn" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer__body" id="cartBody"></div>
  <div class="drawer__foot" id="cartFoot" hidden>
    <div class="line"><span data-i18n="cart.subtotal"></span><span id="cartSub"></span></div>
    <button class="btn btn--solid btn--block" id="checkoutBtn" data-i18n="cart.checkout"></button>
  </div>
</aside>

<!-- ═══════════ نافذة إتمام الطلب (تجريبية) ═══════════ -->
<div class="modal" id="coModal">
  <div class="modal__box">
    <button class="icon-btn modal__x" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="steps" id="coSteps">
      <i><span data-i18n="co.s1"></span></i><i><span data-i18n="co.s2"></span></i>
      <i><span data-i18n="co.s3"></span></i><i><span data-i18n="co.s4"></span></i>
    </div>
    <div class="co" id="coBody"></div>
  </div>
</div>

<!-- ═══════════ نافذة تفاصيل المنتج ═══════════ -->
<div class="modal" id="pdModal">
  <div class="modal__box">
    <button class="icon-btn modal__x" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="pd" id="pdBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/vendor/gsap.min.js"></script>
